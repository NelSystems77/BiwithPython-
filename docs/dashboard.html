<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard TiendaPy · BI con Python: Zero to Hero</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="assets/pwa.js" defer></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #stlite-root { position: fixed; inset: 0; }
    #boot-overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #0f172a; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif;
      text-align: center; padding: 24px; z-index: 10;
    }
    #boot-overlay.hidden { display: none; }
    .spinner {
      width: 42px; height: 42px; border-radius: 50%;
      border: 4px solid rgba(226,232,240,0.25); border-top-color: #38bdf8;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #boot-status { font-size: 0.9rem; color: #94a3b8; max-width: 480px; }
    .back-link {
      position: fixed; top: 12px; left: 12px; z-index: 20;
      font-family: 'Inter', system-ui, sans-serif; font-size: 0.85rem;
      background: #0f172a; color: #e2e8f0; padding: 6px 12px; border-radius: 999px;
      text-decoration: none; opacity: 0.85; border: 1px solid rgba(255,255,255,0.15);
    }
    .back-link:hover { opacity: 1; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">&larr; Volver al curso</a>

  <div id="boot-overlay">
    <div class="spinner"></div>
    <strong>Cargando el dashboard en tu navegador…</strong>
    <div id="boot-status">
      Esto corre Python + pandas + Streamlit 100% del lado del cliente con
      <a href="https://github.com/whitphx/stlite" style="color:#38bdf8;">stlite</a> (WebAssembly).
      La primera carga puede tardar 20-40 segundos mientras se descarga el interprete
      de Python y las librerias — no requiere ningun servidor.
    </div>
  </div>

  <div id="stlite-root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

    const overlay = document.getElementById("boot-overlay");

    const { unmount } = mount(
      {
        requirements: ["pandas", "plotly", "jinja2"],
        entrypoint: "streamlit_app.py",
        files: {
          "streamlit_app.py": { url: "./app/streamlit_app.py" },
          "data/ventas.csv": { url: "./data/ventas.csv" },
        },
      },
      document.getElementById("stlite-root")
    );

    // El overlay de carga se oculta apenas Streamlit termina de renderizar
    // la primera vez (heuristica simple basada en la aparicion del DOM de Streamlit).
    const checkReady = setInterval(() => {
      if (document.querySelector('[data-testid="stAppViewContainer"]')) {
        overlay.classList.add("hidden");
        clearInterval(checkReady);
      }
    }, 400);
  </script>
</body>
</html>
